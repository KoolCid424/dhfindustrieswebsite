<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHF Industries</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #07090d;
        color: #ffffff;
        position: relative;
    }

    /* Ambient background glow */
    .glow {
        position: fixed;
        width: 650px;
        height: 650px;
        top: -300px;
        right: -220px;
        border-radius: 50%;
        background: radial-gradient(
            circle,
            rgba(0, 170, 255, 0.16) 0%,
            rgba(0, 170, 255, 0.05) 35%,
            transparent 70%
        );
        pointer-events: none;
    }

    .glow-bottom {
        position: fixed;
        width: 550px;
        height: 550px;
        bottom: -300px;
        left: -220px;
        border-radius: 50%;
        background: radial-gradient(
            circle,
            rgba(0, 229, 154, 0.08) 0%,
            transparent 70%
        );
        pointer-events: none;
    }

    /* Navigation */
    nav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 90px;
        padding: 0 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 5;
    }

    .logo {
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 4px;
    }

    .logo span {
        color: #00aaff;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #7f8996;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #00e59a;
        box-shadow: 0 0 12px rgba(0, 229, 154, 0.8);
    }

    /* Main hero */
    .hero {
        width: 100%;
        height: 100vh;
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 90px 25px 50px;
        position: relative;
    }

    .content {
        width: 100%;
        max-width: 1050px;
        animation: appear 0.9s ease-out;
    }

    .eyebrow {
        display: inline-block;
        padding: 9px 17px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.035);
        color: #8b96a4;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 30px;
    }

    h1 {
        font-size: clamp(52px, 10vw, 125px);
        line-height: 0.88;
        letter-spacing: -6px;
        font-weight: 900;
        margin-bottom: 30px;
    }

    .blue {
        color: #00aaff;
        text-shadow: 0 0 45px rgba(0, 170, 255, 0.2);
    }

    .tagline {
        color: #d8dee6;
        font-size: clamp(19px, 2.7vw, 30px);
        font-weight: 600;
        letter-spacing: -0.5px;
        margin-bottom: 15px;
    }

    .description {
        max-width: 580px;
        margin: 0 auto;
        color: #737e8c;
        font-size: 15px;
        line-height: 1.65;
    }

    /* Email button */
    .contact {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 35px;
        padding: 16px 25px;
        border-radius: 11px;
        background: #ffffff;
        color: #07090d;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
        transition:
            transform 0.2s ease,
            background 0.2s ease,
            color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .contact:hover {
        transform: translateY(-3px);
        background: #00aaff;
        color: #ffffff;
        box-shadow: 0 12px 35px rgba(0, 170, 255, 0.2);
    }

    .arrow {
        font-size: 17px;
        line-height: 1;
    }

    /* Bottom information */
    .bottom {
        position: absolute;
        left: 0;
        bottom: 25px;
        width: 100%;
        text-align: center;
        color: #424b56;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-transform: uppercase;
    }

    /* Entrance animation */
    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(22px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Mobile */
    @media (max-width: 650px) {

        nav {
            height: 75px;
            padding: 0 25px;
        }

        .logo {
            font-size: 18px;
            letter-spacing: 3px;
        }

        .status {
            display: none;
        }

        .hero {
            padding: 80px 20px 55px;
        }

        h1 {
            font-size: clamp(48px, 15vw, 78px);
            letter-spacing: -3px;
            margin-bottom: 25px;
        }

        .eyebrow {
            margin-bottom: 23px;
            font-size: 9px;
        }

        .tagline {
            font-size: 20px;
        }

        .description {
            font-size: 14px;
            max-width: 390px;
        }

        .contact {
            margin-top: 30px;
        }

        .bottom {
            bottom: 18px;
        }
    }

    /* Very short screens */
    @media (max-height: 600px) {

        nav {
            height: 65px;
        }

        .hero {
            padding-top: 65px;
            padding-bottom: 35px;
        }

        .eyebrow {
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 18px;
        }

        .tagline {
            margin-bottom: 8px;
        }

        .contact {
            margin-top: 20px;
        }

        .bottom {
            display: none;
        }
    }
</style>

</head>

<body>

<div class="glow"></div>
<div class="glow-bottom"></div>

<nav>
    <div class="logo">DHF<span>.</span></div>

```
<div class="status">
    <span class="status-dot"></span>
    Industries That Work
</div>
```

</nav>

<main class="hero">

```
<div class="content">

    <div class="eyebrow">
        DHF Industries
    </div>

    <h1>
        INDUSTRIES<br>
        <span class="blue">THAT WORK.</span>
    </h1>

    <div class="tagline">
        Industries That Work For You!
    </div>

    <p class="description">
        Practical ideas. Powerful technology. Solutions designed
        to work for the people who use them.
    </p>

    <a
        class="contact"
        href="mailto:hello@dhfindustries.online"
    >
        SAY HI
        <span class="arrow">→</span>
    </a>

</div>

<div class="bottom">
    hello@dhfindustries.online
</div>
```

</main>

</body>
</html>
